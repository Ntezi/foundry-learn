<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundry Learn</title>
  <meta name="description" content="A reading app for the Foundry Ontology study notes: learning path, notes, topic map, glossary and search.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b6cb0'/%3E%3Ccircle cx='11' cy='11' r='3.5' fill='white'/%3E%3Ccircle cx='21' cy='11' r='3.5' fill='white'/%3E%3Ccircle cx='16' cy='22' r='3.5' fill='white'/%3E%3Cpath d='M11 11L21 11L16 22Z' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('fl:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <a class="brand" href="#/">
      <svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#2b6cb0"/><circle cx="11" cy="11" r="3.5" fill="white"/><circle cx="21" cy="11" r="3.5" fill="white"/><circle cx="16" cy="22" r="3.5" fill="white"/><path d="M11 11L21 11L16 22Z" fill="none" stroke="white" stroke-width="1.6"/></svg>
      <span>Foundry Learn</span>
    </a>
    <nav class="topnav" id="topnav"></nav>
    <button class="search-btn" id="search-btn" aria-label="Search notes">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
      <span>Search</span><kbd>⌘K</kbd>
    </button>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Notes navigation"></aside>
    <div class="backdrop" id="backdrop"></div>
    <main class="main" id="main" tabindex="-1">
      <div class="loading">Loading notes…</div>
    </main>
  </div>

  <div class="modal" id="search-modal" hidden role="dialog" aria-modal="true" aria-label="Search">
    <div class="modal-card">
      <div class="modal-input">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
        <input id="search-input" type="search" placeholder="Search notes, headings, glossary terms…" autocomplete="off" spellcheck="false">
        <kbd>esc</kbd>
      </div>
      <div class="modal-results" id="search-results" role="listbox"></div>
      <div class="modal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>[</kbd><kbd>]</kbd> previous / next note (anywhere)</span></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
